<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HOLO POP 2000 ✦ a Y2K skin for Video.js v10</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@videojs/cdn@10.5.0/video.js"></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✦</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="holo-pop.css" />
</head>
<body>
<main class="stage">
  <header class="stage-head">
    <p class="kicker">Video.js v10 skin</p>
    <h1>HOLO&nbsp;POP <span>2000</span></h1>
    <p class="sub">chrome bubbles · iridescent foil · star-shaped scrubbing ✦</p>
  </header>

  <video-player class="holo-player">
    <media-container class="holo">
      <video src="https://stream.mux.com/BV3YZtogl89mg9VcNBhhnHm02Y34zI1nlMuMQfAbl3dM/highest.mp4" playsinline crossorigin preload="auto"></video>

      <!-- decorative Y2K window chrome -->
      <div class="holo-titlebar" aria-hidden="true">
        <span class="holo-dots"><i></i><i></i><i></i></span>
        <span class="holo-file">holo_pop.exe</span>
        <span class="holo-stars">✦ ✧ ✦</span>
      </div>

      <!-- sticker that reacts to state (status is also announced by media-status-announcer) -->
      <div class="holo-sticker" aria-hidden="true">
        <span class="when-playing">♡ now playing</span>
        <span class="when-paused">✿ paused, bestie</span>
      </div>

      <div class="holo-sparkles" aria-hidden="true"></div>

      <media-controls class="holo-controls-root">
        <media-controls-content class="holo-controls">
          <media-time-slider class="holo-time" aria-label="Seek">
            <media-slider-track class="holo-track">
              <media-slider-buffer class="holo-buffer"></media-slider-buffer>
              <media-slider-fill class="holo-fill"></media-slider-fill>
            </media-slider-track>
            <media-slider-thumb class="holo-thumb"></media-slider-thumb>
            <media-slider-value type="pointer" class="holo-tip"></media-slider-value>
          </media-time-slider>

          <media-controls-group class="holo-dock" aria-label="Playback controls">
            <media-seek-button seconds="-10" class="holo-btn holo-seek" aria-label="Back 10 seconds">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/><text x="12" y="16" text-anchor="middle">10</text></svg>
            </media-seek-button>

            <media-play-button class="holo-btn holo-play">
              <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
              <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="2"/><rect x="13.5" y="5" width="4" height="14" rx="2"/></svg>
              <svg class="i-replay" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>
            </media-play-button>

            <media-seek-button seconds="10" class="holo-btn holo-seek" aria-label="Forward 10 seconds">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2l5 4-5 4V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/><text x="12" y="16" text-anchor="middle">10</text></svg>
            </media-seek-button>

            <span class="holo-timechip">
              <media-time type="current"></media-time><span aria-hidden="true" class="slash">/</span><media-time type="duration"></media-time>
            </span>

            <span class="holo-spacer"></span>

            <span class="holo-vol">
              <media-mute-button class="holo-btn holo-mute">
                <svg class="i-vol" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                <svg class="i-muted" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9l5 6m0-6-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              </media-mute-button>
              <media-volume-slider class="holo-volume" aria-label="Volume">
                <media-slider-track class="holo-track">
                  <media-slider-fill class="holo-fill"></media-slider-fill>
                </media-slider-track>
                <media-slider-thumb class="holo-thumb holo-thumb-sm"></media-slider-thumb>
              </media-volume-slider>
            </span>

            <media-pip-button class="holo-btn holo-pip">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><rect x="12" y="11" width="7" height="6" rx="1.5"/></svg>
            </media-pip-button>

            <media-fullscreen-button class="holo-btn holo-fs">
              <svg class="i-enter" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
              <svg class="i-exit" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v4a1 1 0 0 1-1 1H4M20 9h-4a1 1 0 0 1-1-1V4M15 20v-4a1 1 0 0 1 1-1h4M4 15h4a1 1 0 0 1 1 1v4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
            </media-fullscreen-button>
          </media-controls-group>
        </media-controls-content>
      </media-controls>

      <media-hotkey keys="Space" action="togglePaused"></media-hotkey>
      <media-hotkey keys="k" action="togglePaused"></media-hotkey>
      <media-hotkey keys="m" action="toggleMuted"></media-hotkey>
      <media-hotkey keys="f" action="toggleFullscreen"></media-hotkey>
      <media-hotkey keys="ArrowLeft" action="seekStep" value="-5"></media-hotkey>
      <media-hotkey keys="ArrowRight" action="seekStep" value="5"></media-hotkey>
      <media-status-announcer></media-status-announcer>

      <media-error-dialog>
        <media-dialog-popup class="holo-error">
          <media-dialog-title></media-dialog-title>
          <media-dialog-description></media-dialog-description>
          <media-dialog-close></media-dialog-close>
        </media-dialog-popup>
      </media-error-dialog>
    </media-container>
  </video-player>

  <section class="keys" aria-label="Keyboard shortcuts">
    <span><kbd>Space</kbd>/<kbd>K</kbd> play</span>
    <span><kbd>←</kbd><kbd>→</kbd> seek 5s</span>
    <span><kbd>M</kbd> mute</span>
    <span><kbd>F</kbd> fullscreen</span>
    <span><kbd>Tab</kbd> every control</span>
  </section>
</main>
<script type="module" src="holo-pop.js"></script>
</body>
</html>
